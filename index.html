<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23305F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tareas">
<title>Tareas del Día</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#23305F; --navy-2:#2E3D75; --navy-soft:#E9EDF8;
    --bg:#F5F6FA; --card:#FFFFFF; --border:#E3E6EE;
    --text:#151A2D; --muted:#6B7280; --muted-2:#A0A6B4;
    --red:#E0474C; --red-soft:#FDECEC; --amber:#E89B1C; --amber-soft:#FDF3E1;
    --green:#22A06B; --green-soft:#E3F5EC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{min-height:100vh;padding-bottom:110px}
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}

  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
  .hdr{max-width:560px;margin:0 auto;height:64px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 12px}
  .hdr h1{margin:0;text-align:center;font-size:24px;font-weight:800;letter-spacing:-.3px}
  .icon-btn{width:44px;height:44px;border:none;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--text)}
  .icon-btn:active{background:var(--bg)}

  .pills{display:flex;gap:10px;margin:18px 0 16px;overflow-x:auto;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;padding:10px 22px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--muted);font-weight:600;font-size:16px}
  .pill.on{background:var(--navy);border-color:var(--navy);color:#fff}

  /* Calendario */
  .cal{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:14px 12px 8px;box-shadow:0 2px 10px rgba(20,30,70,.05)}
  .cal-top{display:flex;align-items:center;justify-content:space-between;padding:0 6px 6px}
  .cal-title{font-size:19px;font-weight:700}
  .cal-nav{display:flex;align-items:center;gap:2px}
  .today-btn{border:1px solid #FFD102;background:#FFD102;color:var(--navy);font-weight:700;font-size:13px;padding:6px 10px;border-radius:999px;margin-right:4px}
  .cal-toggle{border:none;background:none;color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px;margin:2px auto 0;padding:6px 10px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;touch-action:pan-y}
  .cal{overflow:hidden;touch-action:pan-y}
  .grid.in-l{animation:inL .22s ease}.grid.in-r{animation:inR .22s ease}
  @keyframes inL{from{transform:translateX(40%);opacity:0}to{transform:none;opacity:1}}
  @keyframes inR{from{transform:translateX(-40%);opacity:0}to{transform:none;opacity:1}}
  .dow{font-weight:800;font-size:14px;padding:8px 0 4px;color:var(--navy)}
  .dow:nth-child(6),.dow:nth-child(7){color:var(--red)}
  .day{position:relative;height:46px;display:flex;align-items:center;justify-content:center;border:none;background:none;font-size:17px;color:var(--text);padding:0}
  .day .n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:500}
  .day.today .n{border:2px solid var(--navy);color:var(--navy);font-weight:700}
  .day.sel .n{background:var(--navy);color:#fff;border-color:var(--navy)}
  .day.empty{pointer-events:none}
  .dot{position:absolute;bottom:1px;width:6px;height:6px;border-radius:50%}
  .legend{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--muted);padding:6px 0 4px}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:7px;height:7px;border-radius:50%;display:inline-block}

  /* Resumen */
  .summary{margin-top:16px;background:var(--card);border:2px solid var(--border);border-radius:18px;padding:20px 18px;text-align:center;box-shadow:0 2px 10px rgba(20,30,70,.05)}
  .summary .lbl{font-size:18px;font-weight:500}
  .summary .big{font-size:38px;font-weight:800;color:var(--red);margin:6px 0 4px;letter-spacing:-.5px}
  .summary .big.ok{color:var(--green)}
  .summary .sub{color:var(--muted);font-size:15px}
  .bar{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;margin:14px 0 2px}
  .bar b{display:block;height:100%;width:0;background:var(--navy);border-radius:99px;transition:width .4s ease}
  .bar b.ok{background:var(--green)}

  /* Agregar rápido */
  .quick{margin-top:16px;display:flex;gap:10px}
  .quick input{flex:1;min-width:0;height:58px;border:1px solid var(--border);border-radius:14px;padding:0 16px;font-size:16px;background:#fff;color:var(--text)}
  .quick input:focus{outline:2px solid var(--navy-soft);border-color:var(--navy)}
  .quick button{flex:0 0 auto;height:58px;padding:0 18px;border:none;border-radius:14px;background:var(--navy);color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
  .quick button:active{background:var(--navy-2)}

  .sec{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}
  .sec h2{margin:0;font-size:22px;font-weight:800}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--navy-soft);color:var(--navy);font-weight:600;font-size:13px;padding:6px 10px;border-radius:999px;border:none}
  .group{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 4px 8px}
  .group.late{color:var(--red)}

  /* Tarjetas */
  .item{display:flex;gap:14px;align-items:center;background:#EEF2FC;border:1.5px solid #5B73D1;border-radius:18px;padding:14px 14px 14px 12px;margin-bottom:10px;transition:opacity .2s}
  .item.late{background:#FDF1F1;border-color:#E0474C}
  .item.done{background:#EEF8F3;border-color:#3DB07F}
  .item .chk span{background:#fff}
  .item.done .t{text-decoration:line-through;color:var(--muted-2)}
  .item.done .meta{color:var(--muted-2)}
  .chk{flex:0 0 auto;width:44px;height:44px;border:none;background:none;display:grid;place-items:center;padding:0}
  .chk span{width:30px;height:30px;border-radius:50%;border:2.5px solid #C5CAD6;display:grid;place-items:center;transition:.15s}
  .chk span svg{opacity:0;transform:scale(.5);transition:.15s}
  .item.done .chk span{background:var(--green);border-color:var(--green)}
  .item.done .chk span svg{opacity:1;transform:none}
  .chk:active span{transform:scale(.9)}
  .item .body{min-width:0;flex:1;cursor:pointer}
  .item .t{font-size:17px;font-weight:500;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:var(--muted);margin-top:5px}
  .meta span{display:inline-flex;align-items:center;gap:4px}
  .meta .red{color:var(--red);font-weight:600}
  .prio{flex:0 0 auto;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
  .prio.alta{background:var(--red-soft);color:var(--red)}
  .prio.media{background:var(--amber-soft);color:#B8740A}
  .prio.baja{background:var(--green-soft);color:var(--green)}
  .item.done .prio{opacity:.5}
  .empty-msg{text-align:center;color:var(--muted);padding:34px 10px;font-size:16px}

  .fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:20px;border:none;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(35,48,95,.35);z-index:15}
  .fab:active{transform:scale(.96)}

  /* Hojas */
  .backdrop{position:fixed;inset:0;background:rgba(15,20,40,.45);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .backdrop.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .25s ease;z-index:50;max-height:92vh;overflow-y:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom))}
  .sheet.show{transform:none}
  .grab{width:44px;height:5px;border-radius:9px;background:var(--border);margin:4px auto 12px}
  .sheet h3{margin:0 0 10px;font-size:21px;font-weight:800;text-align:center}
  label.f{display:block;font-weight:700;font-size:15px;margin:14px 0 7px}
  .inp{width:100%;height:52px;border:1px solid var(--border);border-radius:14px;padding:0 14px;font-size:16px;color:var(--text);background:#fff}
  textarea.inp{height:86px;padding:12px 14px;resize:none}
  .inp:focus{outline:2px solid var(--navy-soft);border-color:var(--navy)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .seg6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .seg6 button{height:46px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-weight:700;font-size:15px;color:var(--muted)}
  .seg6 button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .seg6.two{grid-template-columns:1fr 1fr}
  .stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
  .stepper button{height:52px;border-radius:14px;border:1.5px solid var(--border);background:#fff;font-size:24px;font-weight:700;color:var(--navy)}
  .stepper button:active{background:var(--navy-soft)}
  .stepper .inp{text-align:center;font-size:20px;font-weight:700}
  .count{flex:0 0 auto;font-size:12px;font-weight:800;padding:7px 11px;border-radius:999px;background:#FFD102;color:var(--navy);border:none;display:inline-flex;align-items:center;gap:4px}
  .count:active{transform:scale(.95)}
  .occ{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px;border:none;background:none;border-bottom:1px solid var(--border);text-align:left;color:var(--text);border-radius:12px}
  .occ:last-child{border-bottom:none}
  .occ.cur{background:#FFF6CC}
  .occ .num{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--navy-soft);color:var(--navy)}
  .occ.ok .num{background:var(--green);color:#fff}
  .occ.late .num{background:var(--red-soft);color:var(--red)}
  .occ .od{flex:1;min-width:0}
  .occ .od b{display:block;font-size:16px;font-weight:700}
  .occ .od small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  .occ .st{flex:0 0 auto;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
  .st.ok{background:var(--green-soft);color:var(--green)}
  .st.pend{background:var(--bg);color:var(--muted)}
  .st.late{background:var(--red-soft);color:var(--red)}
  .occ-sub{text-align:center;color:var(--muted);font-size:14px;margin:-4px 0 10px}
  /* Modal de fechas: versión ligera */
  #datesSheet h3{font-weight:600;font-size:18px}
  #datesSheet .occ-sub{font-size:13px;font-weight:400;margin:0 0 14px}
  #datesSheet .occ{padding:11px 8px;border-bottom-color:#EEF0F4}
  #datesSheet .occ .num{width:26px;height:26px;font-size:12px;font-weight:500;background:transparent;border:1px solid var(--border);color:var(--muted)}
  #datesSheet .occ.ok .num{background:transparent;border-color:var(--green);color:var(--green)}
  #datesSheet .occ.late .num{background:transparent;border-color:#F3C4C6;color:var(--red)}
  #datesSheet .occ .od b{font-size:15px;font-weight:400}
  #datesSheet .occ .od small{font-size:12px}
  #datesSheet .occ .st{background:none;padding:0;font-size:12px;font-weight:500}
  #datesSheet .st.pend{color:var(--muted-2)}
  #datesSheet .occ.cur{background:#FFF9DD}
  #datesSheet .occ.skipped{opacity:.45}
  #datesSheet .occ.skipped b{text-decoration:line-through}
  #datesSheet .btn{font-weight:500;height:50px}
  .item.done .count{opacity:.5}
  .toggle{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:12px 14px;border:1px solid var(--border);border-radius:14px}
  .toggle span{font-weight:600}
  .sw-t{position:relative;width:50px;height:30px}
  .sw-t input{opacity:0;width:0;height:0}
  .sw-t b{position:absolute;inset:0;background:#D6DAE4;border-radius:99px;transition:.2s}
  .sw-t b::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .sw-t input:checked+b{background:var(--navy)}
  .sw-t input:checked+b::after{transform:translateX(20px)}
  .btn{width:100%;height:54px;border-radius:14px;font-size:17px;font-weight:700;border:none;margin-top:18px}
  .btn.primary{background:var(--navy);color:#fff}
  .btn.outline{background:#fff;color:var(--navy);border:1.5px solid var(--navy);margin-top:10px}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red);margin-top:10px}
  .btn.ghost{background:var(--bg);color:var(--text);margin-top:10px}
  .hint{font-size:13px;color:var(--muted);margin-top:6px}
  .menu-item{display:flex;align-items:center;gap:14px;width:100%;padding:16px 8px;border:none;background:none;font-size:16px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);text-align:left}
  .menu-item.red{color:var(--red)}

  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;opacity:0;transition:.25s;z-index:60;max-width:90vw;text-align:center;display:flex;gap:14px;align-items:center;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .toast button{background:none;border:none;color:#9DB4FF;font-weight:800;font-size:15px;padding:0}

  /* Editar tarea: versión compacta */
  #formSheet{padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
  #formSheet .grab{margin:2px auto 8px}
  #formSheet h3{font-size:17px;font-weight:700;margin-bottom:4px}
  #formSheet label.f{font-size:13px;font-weight:600;margin:10px 0 5px;color:var(--muted)}
  #formSheet .inp{height:42px;font-size:15px;border-radius:11px;padding:0 12px}
  #formSheet select.inp{padding:0 10px}
  #formSheet textarea.inp{height:64px;padding:9px 12px}
  #formSheet .row{gap:10px}
  #formSheet .toggle{margin-top:12px;padding:8px 12px;border-radius:11px}
  #formSheet .toggle span{font-size:14px;font-weight:500}
  #formSheet .sw-t{width:42px;height:25px}
  #formSheet .sw-t b::after{width:19px;height:19px}
  #formSheet .sw-t input:checked+b::after{transform:translateX(17px)}
  #formSheet .stepper{grid-template-columns:42px 1fr 42px;gap:6px}
  #formSheet .stepper button{height:42px;font-size:20px;border-radius:11px}
  #formSheet .stepper .inp{font-size:16px}
  #formSheet .seg6 button{height:38px;font-size:13px;border-radius:10px}
  #formSheet .hint{font-size:12px;margin-top:4px}
  #formSheet .btn{height:44px;font-size:15px;border-radius:11px;margin-top:8px}
  #formSheet .btn.primary{margin-top:14px}
  /* Selector compacto de días */
  .dsel{width:100%;height:42px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
  .dsel small{color:var(--muted);font-size:12px;margin-right:4px}
  .dsel svg{color:var(--muted)}
  .dpop{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(15,20,40,.35)}
  .dpop.show{display:flex}
  .dpop-card{background:#fff;border-radius:16px;padding:12px;width:252px;box-shadow:0 12px 30px rgba(15,20,40,.25)}
  .dpop-t{font-size:13px;font-weight:600;color:var(--muted);text-align:center;margin:2px 0 8px}
  .dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dgrid button{height:30px;border:none;border-radius:8px;background:var(--bg);font-size:13px;color:var(--text);padding:0}
  .dgrid button.on{background:var(--navy);color:#fff;font-weight:600}
  .dgrid button:active{transform:scale(.92)}
</style>
</head>
<body>

<header>
  <div class="hdr">
    <span></span>
    <h1>Tareas del Día</h1>
    <button class="icon-btn" id="menuBtn" aria-label="Opciones">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="pills">
    <button class="pill on" data-f="hoy">Hoy</button>
    <button class="pill" data-f="semana">Semana</button>
    <button class="pill" data-f="mes">Mes</button>
    <button class="pill" data-f="todo">Todo</button>
  </div>

  <section class="cal">
    <div class="cal-top">
      <div class="cal-title" id="calTitle"></div>
      <div class="cal-nav">
        <button class="today-btn" id="goToday">Hoy</button>
        <button class="icon-btn" id="prevM" aria-label="Anterior"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="icon-btn" id="nextM" aria-label="Siguiente"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>
    <div class="grid" id="calGrid"></div>
    <div class="legend"><span><i style="background:var(--red)"></i>Pendientes</span><span><i style="background:var(--green)"></i>Todo hecho</span></div>
    <button class="cal-toggle" id="calToggle"></button>
  </section>

  <section class="summary">
    <div class="lbl" id="sumLbl">Tareas de hoy</div>
    <div class="big" id="sumBig">0 / 0</div>
    <div class="sub" id="sumSub">Sin tareas registradas</div>
    <div class="bar"><b id="sumBar"></b></div>
  </section>

  <form class="quick" id="quickForm" autocomplete="off">
    <input id="quickInp" placeholder="Escribe una tarea…" maxlength="100" enterkeyhint="done">
    <button type="submit">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Agregar
    </button>
  </form>

  <div class="sec">
    <h2 id="listTitle">Tareas</h2>
    <button class="chip" id="clearDay" style="display:none">
      <span id="clearDayTxt"></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div id="list"></div>
</main>

<button class="fab" id="fab" aria-label="Nueva tarea">
  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="backdrop" id="backdrop"></div>

<!-- Formulario -->
<div class="sheet" id="formSheet">
  <div class="grab"></div>
  <h3 id="formTitle">Nueva tarea</h3>
  <label class="f" for="fTitle">Tarea</label>
  <input class="inp" id="fTitle" placeholder="Ej: Cobrar a Luis Marín" maxlength="100">
  <div class="row">
    <div><label class="f" for="fDate">Fecha</label><input class="inp" type="date" id="fDate"></div>
    <div><label class="f" for="fTime">Hora (opcional)</label><input class="inp" type="time" id="fTime"></div>
  </div>
  <div id="scopeWrap">
    <label class="f">Al cambiar la fecha, mover</label>
    <div class="seg6 two" id="scopeSeg">
      <button type="button" data-s="one">Solo esta</button>
      <button type="button" data-s="all">Todas</button>
    </div>
  </div>
  <div class="hint" id="dateHint"></div>
  <div class="toggle">
    <span>Repetir tarea</span>
    <label class="sw-t"><input type="checkbox" id="fRep"><b></b></label>
  </div>
  <div id="timesWrap">
    <label class="f" for="fType">Tipo de repetición</label>
    <select class="inp" id="fType">

<div class="dpop" id="dayPop"><div class="dpop-card"><div class="dpop-t" id="dayPopT"></div><div class="dgrid" id="dayGrid"></div></div></div>

<script>
const KEY='tareas_v1', SENT_KEY='tareas_avisos_v1', CAL_KEY='tareas_cal_abierto';
const PRIO_ORDER={alta:0,media:1,baja:2};
const $=id=>document.getElementById(id);

let data=load(KEY,[]);
let view=new Date(); view.setDate(1); view.setHours(0,0,0,0);
let filter='hoy', selDay=null, editId=null;
let calOpen=load(CAL_KEY,true);

function load(k,def){try{const v=JSON.parse(localStorage.getItem(k));return v??def}catch(e){return def}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function save(){store(KEY,data)}

/* ---------- Fechas ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const sameDay=(a,b)=>ymd(a)===ymd(b);
const startDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayD=()=>startDay(new Date());

const dayDiff=(a,b)=>Math.round((startDay(a)-startDay(b))/864e5);
/* Número de repetición (1..times) de la tarea en ese día, o 0 si no toca */
function occIndex(t,day){
  if(!isRule(t))return 0;
  return occMap(t).get(ymd(day))||0;
  const diff=dayDiff(day,parseYmd(t.date)),e=t.every||1;
  if(diff<0||diff%e)return 0;
  const n=diff/e+1;return n<=(t.times||1)?n:0;
}
function lastDate(t){const l=genList(t);return parseYmd(l[l.length-1]||t.date)}
const RULES=['every','week','fortnight','month','year'];
const isRule=t=>RULES.includes(t.repeat);
const dimOf=(y,m)=>new Date(y,m+1,0).getDate();
const _cache=new Map();
/* Lista de fechas (claves) de todas las repeticiones de una tarea */
function genList(t){
  const sig=[t.repeat,t.date,t.every,t.times,t.wday,t.d1,t.d2,t.mday,t.month].join('|');
  const c=_cache.get(t.id);if(c&&c.sig===sig)return c.list;
  const out=[],s=parseYmd(t.date),N=Math.max(1,t.times||1);
  const push=d=>{if(d>=s&&out.length<N)out.push(ymd(d))};
  if(t.repeat==='every'){for(let i=0;i<N;i++)out.push(ymd(addDays(s,i*(t.every||1))))}
  else if(t.repeat==='week'){let d=new Date(s);while(d.getDay()!==(+t.wday))d=addDays(d,1);for(let i=0;i<N;i++)out.push(ymd(addDays(d,7*i)))}
  else{
    let y=s.getFullYear(),m=s.getMonth(),guard=0;
    while(out.length<N&&guard++<2000){
      const dim=dimOf(y,m);
      if(t.repeat==='fortnight'){[...new Set([t.d1,t.d2].map(v=>Math.min(+v||1,dim)))].sort((a,b)=>a-b).forEach(v=>push(new Date(y,m,v)))}
      else if(t.repeat==='month'){push(new Date(y,m,Math.min(+t.mday||1,dim)))}
      else if(t.repeat==='year'){if(m===(+t.month))push(new Date(y,m,Math.min(+t.mday||1,dim)))}
      if(t.repeat==='year'){y++;m=+t.month}else{m++;if(m>11){m=0;y++}}
    }
  }
  const map=new Map(out.map((k,i)=>[k,i+1]));
  _cache.set(t.id,{sig,list:out,map});return out;
}
function occMap(t){genList(t);return _cache.get(t.id).map}
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function ruleText(t){
  switch(t.repeat){
    case 'every':return t.every===1?'Diaria':'Cada '+t.every+' días';
    case 'week':return 'Cada '+DIA[+t.wday];
    case 'fortnight':return `Quincenal · días ${t.d1} y ${t.d2}`;
    case 'month':return 'Cada mes, día '+t.mday;
    case 'year':return `Cada año, ${t.mday} de ${MES[+t.month]}`;
  }return '';
}
const isRep=t=>t.repeat&&t.repeat!=='none';

/* ¿La tarea toca este día? */
function occursOn(t,day){
  const b=parseYmd(t.date);if(day<b)return false;
  if(t.until&&ymd(day)>t.until)return false;
  switch(t.repeat){
    case 'every':case 'week':case 'fortnight':case 'month':case 'year':return occIndex(t,day)>0;
    case 'daily':return true;
    case 'weekdays':{const w=day.getDay();return w>0&&w<6}
    case 'weekly':return day.getDay()===b.getDay();
    case 'monthly':{const dim=new Date(day.getFullYear(),day.getMonth()+1,0).getDate();return day.getDate()===Math.min(b.getDate(),dim)}
    default:return sameDay(day,b);
  }
}
function isDone(t,key){return !!(t.done&&t.done[key])}
/* Claves originales de las repeticiones que caen en este día (respetando las movidas) */
function keysOn(t,day){
  const k=ymd(day),out=[],mv=t.moved||{},sk=t.skip||{};
  if(occursOn(t,day)&&!mv[k]&&!sk[k])out.push(k);
  for(const o in mv)if(mv[o]===k&&o!==k&&!sk[o]&&occursOn(t,parseYmd(o)))out.push(o);
  return out;
}
const effDate=(t,key)=>(t.moved&&t.moved[key])||key;
function tasksOn(day){const r=[];data.forEach(t=>keysOn(t,day).forEach(key=>r.push({t,key,day})));return r}
function overdue(){const today=todayD();
  return data.filter(t=>(!t.repeat||t.repeat==='none')&&parseYmd(t.date)<today&&!isDone(t,t.date))
    .map(t=>({t,key:t.date,day:parseYmd(t.date),late:true}));}

/* ---------- Formatos ---------- */
const fMonth=d=>d.toLocaleDateString('es-CO',{month:'long',year:'numeric'});
const fDay=d=>d.toLocaleDateString('es-CO',{day:'numeric',month:'long'});
const fDayShort=d=>d.toLocaleDateString('es-CO',{day:'numeric',month:'short'});
const fWeekday=d=>{const s=d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});return s.charAt(0).toUpperCase()+s.slice(1)};
function fTime(s){if(!s)return'';const [h,m]=s.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const REP_TXT={daily:'Diaria',weekdays:'L a V',weekly:'Semanal',monthly:'Mensual'};

const I={
  check:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  clock:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  bell:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 16v-5a6 6 0 10-12 0v5l-2 2h16z"/><path d="M10 20a2 2 0 004 0"/></svg>`,
  rep:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 014-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 01-4 4H4"/></svg>`,
  note:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 11h12M4 16h14"/></svg>`,
  up:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>`,
  down:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`
};

/* ---------- Calendario ---------- */
function renderCal(){
  $('calTitle').textContent=fMonth(view).replace(/^./,c=>c.toUpperCase());
  const g=$('calGrid');let h='';
  ['L','M','M','J','V','S','D'].forEach(x=>h+=`<div class="dow">${x}</div>`);
  const today=new Date();
  const ref=selDay||today;
  let days=[];
  if(calOpen){
    const first=(view.getDay()+6)%7,dim=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
    for(let i=0;i<first;i++)days.push(null);
    for(let d=1;d<=dim;d++)days.push(new Date(view.getFullYear(),view.getMonth(),d));
  }else{
    const mon=addDays(startDay(ref),-((ref.getDay()+6)%7));
    for(let i=0;i<7;i++)days.push(addDays(mon,i));
  }
  days.forEach(dt=>{
    if(!dt){h+=`<div class="day empty"></div>`;return}
    const cls=['day'];if(sameDay(dt,today))cls.push('today');if(selDay&&sameDay(dt,selDay))cls.push('sel');
    const list=tasksOn(dt);let dot='';
    if(list.length){const pend=list.some(x=>!isDone(x.t,x.key));dot=`<i class="dot" style="background:${pend?'var(--red)':'var(--green)'}"></i>`}
    h+=`<button class="${cls.join(' ')}" data-k="${ymd(dt)}"><span class="n">${dt.getDate()}</span>${dot}</button>`;
  });
  g.innerHTML=h;
  g.querySelectorAll('.day[data-k]').forEach(b=>b.onclick=()=>{
    const dt=parseYmd(b.dataset.k);
    selDay=(selDay&&sameDay(selDay,dt))?null:dt;
    if(!selDay)filter='hoy';
    render();
  });
  $('calToggle').innerHTML=calOpen?`Ver solo la semana ${I.up}`:`Ver mes completo ${I.down}`;
}

/* ---------- Lista ---------- */
function sortItems(a,b){
  const da=isDone(a.t,a.key),db=isDone(b.t,b.key);
  if(da!==db)return da?1:-1;
  const ta=a.t.time||'99:99',tb=b.t.time||'99:99';
  if(ta!==tb)return ta<tb?-1:1;
  return PRIO_ORDER[a.t.prio||'media']-PRIO_ORDER[b.t.prio||'media'];
}
function periodDays(){
  const t=todayD();
  if(selDay)return[startDay(selDay)];
  if(filter==='hoy')return[t];
  if(filter==='semana'){const mon=addDays(t,-((t.getDay()+6)%7));return[...Array(7)].map((_,i)=>addDays(mon,i))}
  if(filter==='mes'){const dim=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();return[...Array(dim)].map((_,i)=>new Date(view.getFullYear(),view.getMonth(),i+1))}
  return null;
}
function cardHTML(x){
  const t=x.t,done=isDone(t,x.key);
  let meta='',badge='';
  if(x.late)meta+=`<span class="red">Atrasada · ${fDayShort(x.day)}</span>`;
  if(x.showDate&&!x.late)meta+=`<span>${fDayShort(x.day)}</span>`;
  if(t.time)meta+=`<span>${I.clock}${fTime(t.time)}</span>`;
  if(isRule(t)){
    meta+=`<span>${I.rep}${ruleText(t)}</span>`;
    const n=x.key!=='__'?occIndex(t,parseYmd(x.key)):0;
    badge=`<button class="count" data-id="${t.id}" data-k="${x.key}" aria-label="Ver fechas">${n?n+' de '+t.times:t.times+' veces'}</button>`;
  }else if(isRep(t))meta+=`<span>${I.rep}${REP_TXT[t.repeat]}</span>`;
  if(t.alarm&&t.time)meta+=`<span>${I.bell}</span>`;
  if(t.notes)meta+=`<span>${I.note}</span>`;
  return `<div class="item ${done?'done':''} ${x.late?'late':''}">
    <button class="chk" data-id="${t.id}" data-k="${x.key}" aria-label="Marcar como hecha"><span>${I.check}</span></button>
    <div class="body" data-id="${t.id}" data-k="${x.key}">
      <div class="t">${esc(t.title)}</div>
      ${meta?`<div class="meta">${meta}</div>`:''}
    </div>
    ${badge}
  </div>`;
}
function renderList(){
  const titles={hoy:'Tareas de hoy',semana:'Tareas de la semana',mes:'Tareas del mes',todo:'Todas las tareas'};
  $('listTitle').textContent=selDay?(sameDay(selDay,new Date())?'Tareas de hoy':'Tareas del día'):titles[filter];
  $('clearDay').style.display=selDay?'inline-flex':'none';
  if(selDay)$('clearDayTxt').textContent=fDay(selDay);

  let html='';const days=periodDays();
  const showLate=!selDay&&filter==='hoy'||selDay&&sameDay(selDay,new Date());
  if(showLate){const late=overdue();if(late.length)html+=`<div class="group late">Atrasadas (${late.length})</div>`+late.map(cardHTML).join('')}

  if(days){
    const multi=days.length>1;let any=false;
    days.forEach(d=>{
      const items=tasksOn(d).sort(sortItems);if(!items.length)return;any=true;
      if(multi)html+=`<div class="group">${sameDay(d,new Date())?'Hoy · ':''}${fWeekday(d)}</div>`;
      html+=items.map(cardHTML).join('');
    });
    if(!any&&!html)html=`<div class="empty-msg">No hay tareas en este período.<br>Escribe una arriba para empezar ✍️</div>`;
  }else{
    const once=data.filter(t=>!t.repeat||t.repeat==='none').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.time||'99')<(b.time||'99')?-1:1);
    const reps=data.filter(t=>t.repeat&&t.repeat!=='none');
    if(reps.length)html+=`<div class="group">Tareas repetitivas</div>`+reps.map(t=>{const k=ymd(new Date());return cardHTML({t,key:occursOn(t,todayD())?k:'__',day:todayD()})}).join('');
    if(once.length)html+=`<div class="group">Tareas únicas</div>`+once.map(t=>cardHTML({t,key:t.date,day:parseYmd(t.date),showDate:true})).join('');
    if(!html)html=`<div class="empty-msg">Aún no tienes tareas.</div>`;
  }
  $('list').innerHTML=html;
  $('list').querySelectorAll('.chk').forEach(b=>b.onclick=()=>toggleDone(b.dataset.id,b.dataset.k));
  $('list').querySelectorAll('.body').forEach(b=>b.onclick=()=>openForm(b.dataset.id,b.dataset.k));
  $('list').querySelectorAll('.count').forEach(b=>b.onclick=()=>openDates(b.dataset.id,b.dataset.k));
}

/* ---------- Resumen ---------- */
function renderSummary(){
  let items=[],lbl;
  const days=periodDays();
  if(days){days.forEach(d=>items.push(...tasksOn(d)))}
  else{data.forEach(t=>{if(!t.repeat||t.repeat==='none')items.push({t,key:t.date});else if(occursOn(t,todayD()))items.push({t,key:ymd(new Date())})})}
  if(selDay)lbl=sameDay(selDay,new Date())?'Tareas de hoy':'Tareas del '+fDay(selDay);
  else lbl={hoy:'Tareas de hoy',semana:'Tareas de la semana',mes:'Tareas del mes',todo:'Todas las tareas'}[filter];
  const total=items.length,done=items.filter(x=>isDone(x.t,x.key)).length,pend=total-done;
  const pct=total?Math.round(done/total*100):0,ok=total>0&&pend===0;
  $('sumLbl').textContent=lbl;
  $('sumBig').textContent=`${done} / ${total}`;
  $('sumBig').classList.toggle('ok',ok);
  $('sumSub').textContent=!total?'Sin tareas registradas':ok?'¡Todo listo! 🎉':`${pend} pendiente${pend>1?'s':''} · ${pct}% completado`;
  $('sumBar').style.width=pct+'%';$('sumBar').classList.toggle('ok',ok);
}

function render(){
  document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('on',!selDay&&p.dataset.f===filter));
  renderCal();renderSummary();renderList();
}

/* ---------- Acciones ---------- */
function toggleDone(id,key){
  const t=data.find(x=>x.id===id);if(!t||key==='__')return;
  t.done=t.done||{};
  if(t.done[key])delete t.done[key];else{t.done[key]=Date.now();if(navigator.vibrate)navigator.vibrate(25)}
  save();render();
}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function currentDateKey(){return ymd(selDay||(filter==='mes'&&view.getMonth()!==new Date().getMonth()?view:new Date()))}

$('quickForm').onsubmit=e=>{
  e.preventDefault();const title=$('quickInp').value.trim();if(!title)return;
  data.push({id:newId(),title,date:currentDateKey(),time:'',repeat:'none',alarm:false,before:0,notes:'',done:{}});
  save();$('quickInp').value='';render();toast('Tarea agregada');
};

/* ---------- Formulario ---------- */
function openSheet(id){$('backdrop').classList.add('show');$(id).classList.add('show')}
function closeSheets(){$('backdrop').classList.remove('show');document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'))}
let formEvery=0;
const clampE=v=>Math.max(1,Math.min(30,Math.round(+v)||1));

/* Mueve todas las repeticiones: ajusta la regla y reubica checks/movidas por posición */
function moveAll(t,n,anchor){
  if(!n)return;
  if(t.repeat==='every'){shiftSeries(t,n);return}
  const oldL=genList(t).slice(),sh=k=>ymd(addDays(parseYmd(k),n)),cl=v=>Math.max(1,Math.min(31,v));
  t.date=sh(t.date);
  if(t.repeat==='week')t.wday=anchor.getDay();
  else if(t.repeat==='month')t.mday=anchor.getDate();
  else if(t.repeat==='year'){t.mday=anchor.getDate();t.month=anchor.getMonth()}
  else if(t.repeat==='fortnight'){t.d1=cl(t.d1+n);t.d2=cl(t.d2+n)}
  const newL=genList(t),idx=new Map(oldL.map((k,i)=>[k,i])),re=k=>{const i=idx.get(k);return i==null?null:newL[i]};
  const dn={};for(const k in t.done||{}){const r=re(k);if(r)dn[r]=t.done[k]}t.done=dn;
  const sk={};for(const k in t.skip||{}){const r=re(k);if(r)sk[r]=1}t.skip=sk;
  const mv={};for(const k in t.moved||{}){const r=re(k);if(r)mv[r]=sh(t.moved[k])}t.moved=mv;
}
/* Desplaza toda la serie n días (inicio, repeticiones movidas y checks) */
function shiftSeries(t,n){
  if(!n)return;const sh=k=>ymd(addDays(parseYmd(k),n));
  t.date=sh(t.date);
  const mv={};for(const k in t.moved||{})mv[sh(k)]=sh(t.moved[k]);t.moved=mv;
  const dn={};for(const k in t.done||{})dn[sh(k)]=t.done[k];t.done=dn;
  const sk={};for(const k in t.skip||{})sk[sh(k)]=1;t.skip=sk;
}

function openDates(id,curKey){
  const t=data.find(x=>x.id===id);if(!t)return;
  const start=parseYmd(t.date),today=todayD();let done=0,html='';
  const L=genList(t);
  for(let i=0;i<L.length;i++){
    const k=L[i],eff=parseYmd(effDate(t,k)),ok=isDone(t,k);
    if(t.skip&&t.skip[k]){html+=`<div class="occ skipped"><span class="num">${i+1}</span><span class="od"><b>${fWeekday(parseYmd(k))}</b></span><span class="st pend">Eliminada</span></div>`;continue}
    if(ok)done++;
    const late=!ok&&eff<today,cls=ok?'ok':late?'late':'';
    const st=ok?'<span class="st ok">Hecha</span>':late?'<span class="st late">Atrasada</span>':'<span class="st pend">Pendiente</span>';
    const moved=effDate(t,k)!==k?`<small>Movida desde el ${fDayShort(parseYmd(k))}</small>`:(sameDay(eff,today)?'<small>Hoy</small>':'');
    html+=`<button class="occ ${cls} ${k===curKey?'cur':''}" data-d="${ymd(eff)}">
      <span class="num">${ok?'✓':i+1}</span>
      <span class="od"><b>${fWeekday(eff)}</b>${moved}</span>${st}</button>`;
  }
  $('datesTitle').textContent=t.title;
  $('datesSub').textContent=`${ruleText(t)} · ${L.length} veces · ${done} hecha${done===1?'':'s'}`;
  $('datesList').innerHTML=html;
  $('datesList').querySelectorAll('.occ').forEach(b=>b.onclick=()=>{
    const d=parseYmd(b.dataset.d);selDay=d;view=new Date(d.getFullYear(),d.getMonth(),1);closeSheets();render();
    window.scrollTo({top:document.querySelector('.sec').offsetTop-80,behavior:'smooth'});
  });
  openSheet('datesSheet');
  setTimeout(()=>{const c=$('datesList').querySelector('.cur');if(c)c.scrollIntoView({block:'center'})},280);
}

/* ---------- Toast ---------- */
function toast(t,undo){
  const el=$('toast');$('toastTxt').textContent=t;
  $('toastBtn').style.display=undo?'inline':'none';
  $('toastBtn').onclick=()=>{undo&&undo();el.classList.remove('show')};
  el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),undo?4500:2400);
}

/* ---------- Notificaciones ---------- */
function askNotif(){
  if(!('Notification' in window)){toast('Este navegador no admite notificaciones');return}
  Notification.requestPermission().then(p=>toast(p==='granted'?'Notificaciones activadas':'Notificaciones bloqueadas'));
}
async function notify(title,body){
  toast('🔔 '+title);
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    if(reg)reg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',vibrate:[200,100,200],tag:title+body});
    else new Notification(title,{body,icon:'icon-192.png'});
  }catch(e){}
}
function checkAlarms(){
  const now=new Date(),sent=load(SENT_KEY,{});
  [addDays(todayD(),-1),todayD(),addDays(todayD(),1)].forEach(day=>{
    tasksOn(day).forEach(({t,key})=>{
      if(!t.alarm||!t.time||isDone(t,key))return;
      const [h,m]=t.time.split(':').map(Number);
      const when=new Date(day.getFullYear(),day.getMonth(),day.getDate(),h,m);
      const at=new Date(when.getTime()-(t.before||0)*6e4),sk=t.id+'@'+key;
      if(at<=now&&now-at<15*6e4&&!sent[sk]){sent[sk]=Date.now();
        notify(t.title,`Tarea ${t.before?'en '+t.before+' min':'ahora'} · ${fTime(t.time)}${t.notes?' — '+t.notes:''}`)}
    });
  });
  Object.keys(sent).forEach(k=>{if(sent[k]<Date.now()-7*864e5||sent[k]===1)delete sent[k]});
  store(SENT_KEY,sent);
}
